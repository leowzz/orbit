[project]
name = "orbit-display-xiaozhi-320x240-ma-xin-wifi"
version = "0.1.0"
description = "Orbit Xiaozhi 320x240 Ma Xin WiFi firmware"
requires-python = ">=3.13"
dependencies = [
    "grpcio-tools==1.83.1",
    "nanopb==0.4.9.1",
    # PlatformIO's esptool post-install script invokes python -m pip.
    "pip==26.2",
    "platformio==6.1.19",
    "pytest==8.4.2",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
