[platformio]
default_envs = yd_esp32s3

[env]
test_framework = unity
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:native]
platform = native
lib_compat_mode = off
test_build_src = yes
build_src_filter =
    -<*>
	+<nanopb_protocol.cpp>
	+<generated-proto/>
build_flags =
    ${env.build_flags}
    -I../../include
	-Isrc/generated-proto
lib_deps =
    file://../../../../common
	nanopb/Nanopb @ 0.4.91

[env:yd_esp32s3]
platform = platformio/espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:scripts/platformio_generate_config.py
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/generated-proto
lib_deps =
    file://../../../../common
    file://../..
    nanopb/Nanopb @ 0.4.91
    olikraus/U8g2 @ 2.36.18
    arduino-libraries/ArduinoMqttClient @ 0.1.8
