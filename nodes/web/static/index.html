<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Orbit 实时状态</title>
    <link rel="stylesheet" href="/app.css?v=20260904-connection-refresh1" />
  </head>
  <body>
    <div class="auth-gate" id="auth-gate">
      <form class="auth-card" id="auth-form">
        <p class="eyebrow">Orbit</p>
        <h1>输入密码</h1>
        <label class="auth-label" for="auth-password">访问密码</label>
        <input class="auth-password" id="auth-password" type="password" autocomplete="current-password" required />
        <button class="auth-submit" id="auth-submit" type="submit">进入</button>
        <p class="auth-error" id="auth-error" role="alert" hidden></p>
      </form>
    </div>
    <header class="topbar">
      <button class="brand" id="fullscreen-toggle" type="button" aria-pressed="false" title="进入全屏">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span>Orbit</span>
      </button>
      <time class="topbar-time" id="updated-at">--</time>
      <button class="connection" id="connection" type="button" data-state="connecting" title="刷新页面">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connection-label">连接中</span>
      </button>
    </header>

    <main>
      <section class="overview" aria-labelledby="overview-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">实时状态</p>
            <h1 id="overview-title">今日概览</h1>
          </div>
        </div>

        <div class="metrics" id="usage-metrics" aria-live="polite">
          <div class="metric">
            <span class="metric-label">实际成本</span>
            <strong id="cost">--</strong>
            <small id="currency">USD</small>
          </div>
          <div class="metric">
            <span class="metric-label">Token</span>
            <strong id="tokens">--</strong>
            <small>今日累计</small>
          </div>
          <div class="metric">
            <span class="metric-label">TPM</span>
            <strong id="tpm">--</strong>
            <small>当前吞吐</small>
          </div>
          <div class="metric metric-accent">
            <span class="metric-label">运行任务</span>
            <strong id="running-count">--</strong>
            <small id="total-count">共 -- 个</small>
          </div>
        </div>
      </section>

      <section class="sessions" aria-labelledby="sessions-title">
        <div class="section-heading compact">
          <div>
            <p class="eyebrow">Codex</p>
            <h2 id="sessions-title">最近任务</h2>
          </div>
        </div>
        <div class="session-list" id="session-list" aria-live="polite">
          <div class="empty-state">
            <span class="empty-orbit" aria-hidden="true"></span>
            <p>等待 Core 投影视图</p>
          </div>
        </div>
        <p class="sr-only" id="action-status" aria-live="polite"></p>
      </section>
    </main>

    <footer>
      <span id="node-id">Node --</span>
      <span id="revision">Revision --</span>
    </footer>
    <script src="/app.js?v=20260904-connection-refresh1" defer></script>
  </body>
</html>
