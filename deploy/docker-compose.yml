x-orbit-service: &orbit-service
  restart: unless-stopped
  volumes:
    - ../configs:/app/configs:ro

services:
  orbit-agent:
    <<: *orbit-service
    image: registry.cn-heyuan.aliyuncs.com/leo03w/orbit-agent:${version:?set version in .env}

  orbit-core:
    <<: *orbit-service
    # Set console.listen: 0.0.0.0:7620, console.database: /app/data/core.sqlite
    # and console.password in core.local.yaml.
    ports:
      - "127.0.0.1:7620:7620"
      - "127.0.0.1:7622:7622"
    volumes:
      - ../configs:/app/configs:ro
      - orbit-core-data:/app/data
    image: registry.cn-heyuan.aliyuncs.com/leo03w/orbit-core:${version:?set version in .env}

  orbit-console:
    restart: unless-stopped
    image: registry.cn-heyuan.aliyuncs.com/leo03w/orbit-console:${version:?set version in .env}
    depends_on:
      - orbit-core
    environment:
      ORBIT_CORE_UPSTREAM: orbit-core:7620
    ports:
      - "127.0.0.1:7621:8080"

volumes:
  orbit-core-data:
