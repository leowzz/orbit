global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
  - job_name: orbit-core
    metrics_path: /metrics
    static_configs:
      - targets:
          - orbit-core:7623
        labels:
          service: orbit-core
