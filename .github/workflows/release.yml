name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and signing credentials
        env:
          TAG: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [[ "$TAG" =~ ^v[A-Za-z0-9_.-]+$ && ${#TAG} -le 128 ]] || {
            echo "::error::Expected a Docker-compatible v-prefixed tag, e.g. v1.2.3 or v1.2.3-rc.1"
            exit 1
          }
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing repository secret: $name"; exit 1; }
          done

  images:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        binary: [orbit-agent, orbit-core, orbit-web]
    env:
      TAG: ${{ github.ref_name }}
      BINARY: ${{ matrix.binary }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test Go services
        run: go test ./...
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Aliyun mirror
        if: env.ALIYUN_REGISTRY_USERNAME != '' && env.ALIYUN_REGISTRY_PASSWORD != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: registry.cn-heyuan.aliyuncs.com
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - name: Image names
        id: names
        run: |
          image="ghcr.io/${REPOSITORY_OWNER,,}/$BINARY"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS'
            echo "$image:$TAG"
            if [[ -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
              echo "registry.cn-heyuan.aliyuncs.com/leo03w/$BINARY:$TAG"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: BINARY=${{ matrix.binary }}
          tags: ${{ steps.names.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign and verify image digest
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST"
          if [[ -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            cosign sign --yes "registry.cn-heyuan.aliyuncs.com/leo03w/$BINARY@$DIGEST"
          fi
          mkdir -p image-notes
          # shellcheck disable=SC2016
          printf -- '- `%s:%s`\n  - Digest: `%s@%s`\n' "$IMAGE" "$TAG" "$IMAGE" "$DIGEST" > "image-notes/$BINARY.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.binary }}
          path: image-notes/*.md
          if-no-files-found: error

  android:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orbit-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/orbit-release.jks" >> "$GITHUB_ENV"
      - name: Check and build signed APK
        working-directory: nodes/android
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build apk --release --build-name "${TAG#v}" --build-number "$GITHUB_RUN_NUMBER"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../../dist/orbit-android-$TAG.apk"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/orbit-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  esp32s3:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
        working-directory: nodes/display/models/oled-128x32/variants/yd-esp32-s3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.13'
      - name: Test and build example-config firmware
        run: |
          uv sync --frozen
          make check
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('config.example.yaml').read_text())
          config['node']['firmware_version'] = os.environ['TAG'][1:]
          Path('config.release.yaml').write_text(yaml.safe_dump(config, sort_keys=False))
          PY
          make build CONFIG=config.release.yaml
          bash "$GITHUB_WORKSPACE/scripts/package-esp32s3.sh" "$TAG" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-esp32s3
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [images, android, esp32s3]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
          path: image-notes
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign and verify downloadable artifacts
        working-directory: dist
        run: |
          sha256sum ./*.apk ./*.tar.gz > SHA256SUMS
          for artifact in ./*.apk ./*.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
            cosign verify-blob --bundle "$artifact.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$artifact"
          done
      - name: Publish GitHub Release
        run: |
          {
            printf '## Docker images (GHCR)\n\n'
            cat image-notes/*.md
            printf '\nImages are signed with Cosign using GitHub Actions OIDC.\n'
            printf '\n## Downloads\n\n'
            printf -- '- Android: release-key-signed APK.\n'
            printf -- '- ESP32-S3: YD-ESP32-S3 / OLED 128x32 firmware archive, including a factory image and flash instructions. Uses placeholder Wi-Fi/MQTT configuration; rebuild with private configuration for a connected device.\n'
            printf -- '- SHA256SUMS and Cosign bundles for download verification (not ESP Secure Boot).\n'
            # shellcheck disable=SC2016
            printf '\nSigning identity: `%s`\n' "$IDENTITY"
          } > release-notes.md
          # Upload to a draft first, so partial uploads never publish a Release.
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            jq -e '.isDraft == true' release-state.json >/dev/null || {
              echo '::error::Release is already published; refusing to replace signed artifacts'
              exit 1
            }
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
