name: Unit Tests

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Go, Web and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install build tools
        run: npm install --global pnpm@11.9.0
      - name: Test Go services and Web
        run: |
          make test
          pnpm --dir web/core-console test
      - name: Test release and signing scripts
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

  android:
    name: Android App and widget service
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            nodes/app/android/**/*.gradle.kts
            nodes/app/android/gradle.properties
            nodes/app/android/gradle/wrapper/gradle-wrapper.properties
            nodes/app/pubspec.lock
            nodes/android/android/**/*.gradle.kts
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Install locked dependencies
        working-directory: nodes/app
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test App
        run: make test-app
      - name: Test widget service
        working-directory: nodes/app/android
        run: ./gradlew :app:testDebugUnitTest

  desktop:
    name: Desktop Agent
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agents/desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          npm install --global pnpm@11.9.0
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and test
        run: |
          pnpm check
          pnpm test:ui
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml

  esp32s3:
    name: ESP32-S3 config and native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nodes/display/models/oled-128x32/variants/yd-esp32-s3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test firmware config and native logic
        run: make check
