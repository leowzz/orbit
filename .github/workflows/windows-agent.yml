name: Windows Agent

on:
  push:
    branches: ['**']
    paths:
      - 'agents/desktop/**'
      - 'proto/**'
      - '.github/workflows/windows-agent.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'agents/desktop/**'
      - 'proto/**'
      - '.github/workflows/windows-agent.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Validated version tag supplied by the release workflow
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 tests and NSIS installer
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 'true'
      CARGO_BUILD_JOBS: '2'
      RELEASE_TAG: ${{ inputs.release-tag }}
    defaults:
      run:
        shell: bash
        working-directory: agents/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          npm install --global pnpm@11.9.0
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agents/desktop/src-tauri -> target
          shared-key: desktop-agent-windows-x64
          cache-bin: false
          cache-on-failure: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript and UI tests
        run: |
          pnpm check
          pnpm test:ui
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Windows Agent
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build release-mode NSIS installer
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            jq -n --arg version "${RELEASE_TAG#v}" '{version: $version}' > "$RUNNER_TEMP/windows-version.json"
            args+=(--config "$RUNNER_TEMP/windows-version.json")
          fi
          pnpm tauri build --bundles nsis "${args[@]}" -- --locked
      - name: Verify and collect installer
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/nsis/*.exe)
          [[ ${#packages[@]} -eq 1 ]] || { echo '::error::Expected exactly one Windows NSIS installer'; exit 1; }
          [[ -s "${packages[0]}" && -s src-tauri/target/release/orbit-desktop-agent.exe ]]
          suffix="${RELEASE_TAG:-${GITHUB_SHA:0:12}}"
          mkdir -p ../../dist/windows-agent
          cp "${packages[0]}" "../../dist/windows-agent/orbit-agent-windows-x64-$suffix-setup.exe"
          cd ../../dist/windows-agent
          sha256sum ./*.exe > WINDOWS-SHA256SUMS
          sha256sum --check WINDOWS-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.release-tag != '' && 'release-windows-agent' || 'windows-agent-x64' }}
          path: dist/windows-agent/*
          if-no-files-found: error
          retention-days: 14
