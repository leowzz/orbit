name: Build Desktop Agent

on:
  pull_request:
    paths: ['agents/desktop/**', 'proto/**', 'scripts/macos-signing.py', 'scripts/test_macos_signing.py', '.github/workflows/build-desktop-agent.yml']
  push:
    branches: [main]
    paths: ['agents/desktop/**', 'proto/**', 'scripts/macos-signing.py', 'scripts/test_macos_signing.py', '.github/workflows/build-desktop-agent.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agents/desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          npm install --global pnpm@11.9.0
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and test
        run: |
          pnpm check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          python3 -B -m unittest discover -s ../../scripts -p test_macos_signing.py
      # Pull requests run checks above without exposing the signing key to PR code.
      - name: Import self-signed Orbit identity
        if: github.event_name != 'pull_request'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ORBIT_SIGNING_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 ../../scripts/macos-signing.py setup
      - name: Build signed test package
        if: github.event_name != 'pull_request'
        run: pnpm tauri build --debug --bundles ${{ matrix.bundle }} -- --locked
      - name: Verify Orbit signing certificate
        if: github.event_name != 'pull_request'
        run: python3 ../../scripts/macos-signing.py verify 'src-tauri/target/debug/bundle/macos/Orbit Agent.app'
      - name: Remove macOS signing material
        if: always() && github.event_name != 'pull_request'
        env:
          ORBIT_SIGNING_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 ../../scripts/macos-signing.py cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: orbit-agent-${{ matrix.os }}-debug
          path: agents/desktop/src-tauri/target/debug/bundle/
          if-no-files-found: error
          retention-days: 14
