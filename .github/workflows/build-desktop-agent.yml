name: Build Desktop Agent

on:
  pull_request:
    paths: ['agents/desktop/**', 'proto/**', '.github/workflows/build-desktop-agent.yml']
  push:
    branches: [main]
    paths: ['agents/desktop/**', 'proto/**', '.github/workflows/build-desktop-agent.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bundle: app
          - os: windows-2022
            bundle: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agents/desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          npm install --global pnpm@11.9.0
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and test
        run: |
          pnpm check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned test package
        run: pnpm tauri build --debug --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-agent-${{ matrix.os }}-debug
          path: agents/desktop/src-tauri/target/debug/bundle/
          if-no-files-found: error
          retention-days: 14
