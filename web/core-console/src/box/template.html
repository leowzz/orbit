<div id="workspace">
  <header>
    <h1>收件箱</h1>
    <label id="search-field" class="search" hidden>
      <input
        id="search"
        type="search"
        aria-label="搜索消息"
        placeholder="搜索文字、链接…"
        autocomplete="off"
      />
    </label>
    <div class="header-actions">
      <button
        id="toggle-search"
        class="header-icon"
        type="button"
        title="搜索消息"
        aria-label="搜索消息"
        aria-expanded="false"
        aria-controls="search-field"
      >
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4 4" />
        </svg>
        <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M6 18 18 6" />
        </svg>
      </button>
      <select id="filter" aria-label="筛选消息" title="筛选消息">
        <option value="all">全部</option>
        <option value="links">链接</option>
        <option value="todo">未完成</option>
        <option value="image">图片</option>
        <option value="completed">已完成</option>
        <option value="deleted">已删除</option>
      </select>
      <span id="sync-state" role="status">正在读取…</span>
      <button
        id="refresh"
        class="header-icon"
        title="同步消息"
        aria-label="同步消息"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M18 18A8 8 0 0 1 5 15"
          />
        </svg>
      </button>
    </div>
  </header>
  <div class="box-content">
    <div id="error" role="alert" hidden></div>
    <section id="messages" aria-label="消息列表"></section>
    <button id="more" hidden>加载更多</button>
  </div>
  <div class="compose-wrap">
    <form id="composer">
      <label class="sr-only" for="body">消息内容</label
      ><textarea
        id="body"
        rows="2"
        maxlength="16000"
        placeholder="写点什么，留给自己…"
      ></textarea>
      <div id="attachment" hidden>
        <span id="attachment-name"></span
        ><button type="button" id="remove-photo">移除图片</button>
      </div>
      <div class="compose-actions">
        <label class="todo-switch"
          ><input id="todo" type="checkbox" />设为待办</label
        ><button
          id="choose-photo"
          type="button"
          title="也可在输入框粘贴或拖入图片"
        >
          添加图片</button
        ><input
          id="photo"
          type="file"
          accept="image/png,image/jpeg,image/gif"
          hidden
        /><span class="shortcut">⌘ / Ctrl + Enter 发送</span
        ><button id="send" class="primary" type="submit">发送</button>
      </div>
    </form>
  </div>
</div>
<dialog id="editor">
  <form id="edit-form">
    <h2>编辑消息</h2>
    <textarea
      id="edit-body"
      rows="8"
      maxlength="16000"
      aria-label="编辑消息内容"
    ></textarea>
    <div class="dialog-actions">
      <button type="button" id="cancel-edit">取消</button
      ><button class="primary">保存</button>
    </div>
  </form>
</dialog>
<dialog id="image-view">
  <button id="close-image" aria-label="关闭图片">关闭</button
  ><img id="full-image" alt="消息原图" />
</dialog>
<div id="toast" role="status" hidden></div>
