syntax = "proto3";
package orbit.v1;
option go_package = "orbit/gen/go/orbit/v1;orbitv1";

// An Agent exports only explicitly configured shortcuts. Local paths stay local.
message AgentShortcut {
  string id = 1;
  string title = 2;
  string kind = 3;
  bytes icon_png = 4;
}
message AgentShortcuts {
  string agent_id = 1;
  string host_label = 2;
  uint64 revision = 3;
  repeated AgentShortcut items = 4;
  bool show_titles = 5;
}
message NavigationItem {
  string id = 1;
  string title = 2;
  string kind = 3;
  string target = 4;
  string agent_id = 5;
  string shortcut_id = 6;
  string icon_url = 7;
  string icon_name = 8;
}
message Navigation {
  string node_id = 1;
  uint64 revision = 2;
  bool show_titles = 3;
  repeated NavigationItem items = 4;
}
