[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-asr-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1,<3", "av>=16,<19", "numpy>=1.26,<3"]

[project.optional-dependencies]
model = ["qwen-asr==0.0.6", "torch>=2.6"]
test = ["pytest>=8,<10"]
gui = ["PySide6-Essentials>=6.8,<7", "keyring>=25,<26"]

[project.scripts]
orbit-asr-worker = "orbit_asr.worker:main"

[project.gui-scripts]
orbit-asr-gui = "orbit_asr.gui:main"

[tool.setuptools.packages.find]
include = ["orbit_asr*"]
