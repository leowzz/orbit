[package]
name = "orbit-desktop-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "orbit_desktop_agent"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
serde_yaml = "0.9"
prost = "0.13"
prost-types = "0.13"
rumqttc = { version = "0.24", features = ["use-rustls"] }
rustls = "0.22"
rustls-pemfile = "2"
rustls-native-certs = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
semver = "1"
tempfile = "3"
hex = "0.4"
dirs = "6"
url = "2"
humantime = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rust_decimal = "1"
open = "5"
base64 = "0.22"
sysinfo = "0.33"
scraper = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
libloading = "0.8"
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
bytes = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData"] }
