# Required values remain active. Optional settings are commented; defaults are noted where applicable.

core:
  id: core-local

# Core's built-in control console. Relative database paths use this YAML's directory.
# Manage projection routes in the console; deployment settings remain in this YAML.
console:
  password: change-me  # Required; replace before running.
  # session_hours: 72  # Login lifetime in hours; defaults to 3 days. Restart Core after changing.
  # listen: 127.0.0.1:7620
  # database: data/core.sqlite

# Total retained audio segments across all devices. Oldest recordings, including
# pending jobs and transcripts, are deleted above this limit. Restart to apply.
audio:
  max_segments: 10000

# Optional application-level NTP calibration. Defaults are shown below.
# ntp:
#   server: ntp.aliyun.com
#   sync_interval: 10m
#   timeout: 2s

mqtt:
  url: mqtts://broker.example.com:8883
  # Optional. TLS defaults to enabled and uses the system root CA pool.
  # Set ca_file for a private CA. Set cert_file and key_file together for mTLS.
  # tls:
  #   enabled: true
  #   ca_file: secrets/mqtt-ca.pem
  #   cert_file: secrets/core-client.pem
  #   key_file: secrets/core-client.key
  # Secret file paths are resolved relative to this configuration file.
  credentials:
    username_file: secrets/core-mqtt-username
    password_file: secrets/core-mqtt-password

# Optional EMQX 5 username management. Empty keys leave this feature disabled.
# Use the management HTTP endpoint, not the MQTT listener. For tx's Docker network:
mqtt_admin:
  url: http://emqx:18083
  # Optional device-reachable listener; defaults to mqtt.url, never the management URL.
  # node_url: mqtts://mqtt.example.com:8883
  api_key: ""
  api_secret: ""

# Projection routes are now managed in the Core console and stored in SQLite.
# Existing projection_routes in older YAML files are imported only at first startup.

observation_policies:
  usage:
    max_ttl: 5m
    # Optional; defaults to 0s.
    # max_future_skew: 10s

  codex:
    max_ttl: 1m
    max_future_skew: 10s

# Optional; defaults to info. Supported values: debug, info, warn, error.
# logging:
#   level: info

# Optional personal inbox API. Terminate HTTPS at your reverse proxy.
# Each installation receives its own random token (at least 32 characters).
# Devices below are imported once when the App registry is first created.
# Afterwards, add devices and rotate/revoke tokens in the Core console.
# Only SHA-256 digests are persisted; new tokens are shown once.
# app:
#   listen: 0.0.0.0:7622
#   data_dir: ../data/app
#   devices:
#     phone-01:
#       label: 我的手机
#       platform: android
#       token_sha256: <SHA-256 hex digest>
#       revoked: false
#
# An App can use the inbox without a status route. To show usage/session,
# add phone-01 in the Core console with profile: overview-app and explicit
# inputs, using the same observation policies as the Web/OLED routes.
