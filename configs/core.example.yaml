core:
  id: core-local

mqtt:
  url: mqtts://broker.example.com:8883
  tls:
    enabled: true
    ca_file: ""
    cert_file: secrets/core-client.pem
    key_file: secrets/core-client.key
  credentials:
    username_file: secrets/core-mqtt-username
    password_file: secrets/core-mqtt-password

projection_routes:
  desk-oled-01:
    profile: usage-oled-128x32
    inputs:
      - agent_id: agent-local
        observation_type: usage
  desk-web-01:
    profile: overview-web
    inputs:
      - agent_id: agent-local
        observation_type: usage
      - agent_id: agent-local
        observation_type: codex

observation_policies:
  usage:
    max_ttl: 5m
    max_future_skew: 10s
  codex:
    max_ttl: 1m
    max_future_skew: 10s

logging:
  level: info
