# Web status and inbox share one registered Web device and its token.
# No MQTT or node.id is needed. Protect remote access with HTTPS.
# Configure this device's status sources in Core (overview-app profile).
web:
  listen: 127.0.0.1:8080
  auth:
    password: change-me
  inbox:
    url: https://orbit.example.com
    token_file: secrets/web-inbox-token
